<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Spec NFR-1 (privacy) and NFR-6 (security): the document never leaves the
      browser. connect-src 'self' blocks any attempt to send PDF bytes anywhere.
      A build-time CSP meta tag is a backstop; the real header should be set by
      whatever static host serves this bundle.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob: data:; object-src 'none'; frame-src 'self' blob:; base-uri 'none'; form-action 'none'"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Ticket Ink-Saver</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
